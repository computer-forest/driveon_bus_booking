name: charter_booking_ui
description: UI layer for the Bus & Tempo Traveller Charter Booking App (Phase 0 → Flutter).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  sendotp_flutter_sdk: ^0.0.2
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2

flutter:
  uses-material-design: true
